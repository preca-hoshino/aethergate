# ==============================================================================
# Æthergate Agent — Node Daemon & sing-box Supervisor
# ==============================================================================

services:
  aethergate-agent:
    image: ghcr.nju.edu.cn/${AETHERGATE_IMAGE_OWNER:-preca-hoshino}/aethergate-agent:${AETHERGATE_TAG:-latest}
    container_name: aethergate-agent
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./config.agent.toml:/etc/aethergate/config.agent.toml:ro
      - agent_certs:/etc/aethergate/certs
      - agent_wal:/var/lib/aethergate/wal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agent_certs:
  agent_wal:

# Æthergate Node Agent Configuration (flat TOML matching AgentConfig)

node_id = "00000000-0000-0000-0000-000000000000"
hmac_secret = "replace-with-node-hmac-secret"
server_url = "https://proxy.restart.org.cn"

singbox_bin = "/usr/local/bin/sing-box"
singbox_config_path = "/etc/aethergate/sing-box.json"
cert_dir = "/etc/aethergate/certs"
wal_dir = "/var/lib/aethergate/wal"

v2ray_api_addr = "127.0.0.1:10085"
clash_api_addr = "http://127.0.0.1:19090"
clash_secret = "change-me-local-clash-secret"
sample_interval_secs = 2
